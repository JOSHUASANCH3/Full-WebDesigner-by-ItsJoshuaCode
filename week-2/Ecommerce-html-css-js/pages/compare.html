<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Page Title -->
  <title>Compare - Ecommerce Page</title>

  <!-- Meta Keywords and Description -->
  <meta name="keywords" content="">
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="shortcut icon" href="../assets/images/favicon.ico" />

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Main CSS Files -->
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>

<body>
  <!--=============== HEADER ===============-->
  <header class="header">
    <!-- Header Top -->
    <div class="header__top">
      <div class="header__container container">
        <div class="header__contact">
          <span>(+505) 82739293</span>
          <span>Our Location</span>
        </div>
        <p class="header__alert-news">
          Super Value Deals - Save more with coupons
        </p>
        <a href="../pages/login-register.html" class="header__top-action">Log in / Sign Up</a>
      </div>
    </div>

    <!-- Second Header -->
    <nav class="header__nav container">
      <a href="/week-2/Ecommerce-html-css-js/index.html" class="nav__logo">
        <img src="../assets/images/logo.svg" alt="Logo del Ecommerce" class="nav__logo-img">
      </a>

      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list">
          <!-- Home Page -->
          <li class="nav__item">
            <a href="/week-2/Ecommerce-html-css-js/index.html" class="nav__link">Home</a>
          </li>
          <!-- Shop Page -->
          <li class="nav__item">
            <a href="../pages/shop.html" class="nav__link active__link">Shop</a>
          </li>
          <!-- Page Account -->
          <li class="nav__item">
            <a href="../pages/accounts.html" class="nav__link">My Account</a>
          </li>
          <!-- Compare Page -->
          <li class="nav__item">
            <a href="../pages/compare.html" class="nav__link">Compare</a>
          </li>
          <!-- Login Page -->
          <li class="nav__item">
            <a href="../pages/login-register.html" class="nav__link">Login</a>
          </li>
        </ul>

        <div class="header__search">
          <input type="text" placeholder="Search for items..." class="form__input">
          <button class="search__btn">
            <img src="../assets/images/company-images/search.png" alt="Icono de imagen de busqueda">
          </button>
        </div>

      </div>

      <div class="header__user-actions">
        <!-- Icon de Corazon -->
        <a href="../pages/wishlist.html" class="header__action-btn">
          <img src="../assets/images/company-images/icon-heart.svg" alt="Icono de corazon">
          <span class="count">3</span>
        </a>

        <!-- Icon de Compra -->
        <a href="../pages/cart.html" class="header__action-btn">
          <img src="../assets/images/company-images/icon-cart.svg" alt="Icono de carrito de compras">
          <span class="count">3</span>
        </a>
      </div>
    </nav>
  </header>

  <!--=============== MAIN ===============-->
  <main class="main">
    <!--=============== BREADCRUMB ===============-->
    <section class="breadcrumb">
      <ul class="breadcrumb__list flex container">
        <li><a href="../index.html" class="breadcrum__link">Home</a></li>
        <li><span class="breadcrumb__link">></span></li>
        <li><span class="breadcrumb__link">Shop</span></li>
        <li><span class="breadcrumb__link">></span></li>
        <li><span class="breadcrumb__link">Checkout</span></li>
      </ul>
    </section>

    <!--=============== COMPARE ===============-->
    <section class="compare"></section>

    <!--=============== NEWSLETTER ===============-->
    <section class="newsletter section">
      <div class="newsletter__container container grid">
        <h3 class="newsletter__title flex">
          <img src="../assets/images/company-images/icon-email.svg" alt="" class="newsletter__img">
          News up to Newsletter
        </h3>
        <p class="newsletter__description">
          ...and recive 125 coupon first shopping
        </p>
        <form action="" class="newsletter__form">
          <input type="text" placeholder="Enter your Email" class="newsletter__input">
          <button type="submit" class="newsletter__btn">Subscribe</button>
        </form>
      </div>
    </section>

  </main>

  <!--=============== FOOTER ===============-->
  <div id="footer__partials"></div>

  <!--=============== SWIPER JS ===============-->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!--=============== MAIN JS ===============-->
  <script src="../assets/config/main.js"></script>

  <!--=============== ICONS ===============-->
  <script src="https://kit.fontawesome.com/1b56d306fa.js" crossorigin="anonymous"></script>

</body>

</html>
